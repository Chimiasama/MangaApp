name: Validar PDF nativo do MangaDash

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar assinatura e acesso ao emulador
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          touch .env
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
                -dname 'CN=Android Debug,O=Android,C=US'
            fi
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Converter PDF e verificar imagens e cache no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.PdfRendererHelperDeviceTest --stacktrace --no-daemon
      - name: Guardar relatório do teste nativo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangadash-native-pdf-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
