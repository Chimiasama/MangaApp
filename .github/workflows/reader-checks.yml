name: Validar leitor Android

on:
  pull_request:
  push:
    branches: [main, 'fix/reader-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Aceitar licenças do Android SDK
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Preparar ambiente e chaves
        shell: bash
        run: |
          set -euo pipefail
          touch .env
          chmod +x ./gradlew

          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "debug.keystore restaurado a partir do base64."
            else
              echo "Gerando debug.keystore..."
              keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
                -dname 'CN=Android Debug,O=Android,C=US'
            fi
          fi

      - name: Compilar, testar gestos e verificar Android Lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace --no-daemon

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

      - name: Guardar APK de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14
