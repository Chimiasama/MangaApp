name: Validar leitor Android

on:
  pull_request:
  push:
    branches: [main, 'fix/reader-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Aceitar licenças do Android SDK
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Preparar ambiente e chaves
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.MANGA_SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          touch .env
          chmod +x ./gradlew

          bash .github/scripts/prepare-debug-signing.sh

      - name: Compilar, testar gestos e verificar Android Lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace --no-daemon

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reader-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

      - name: Guardar APK de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14
