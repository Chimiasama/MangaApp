name: Validar leitor Android

on:
  pull_request:
  push:
    branches: [main, 'fix/reader-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          log-accepted-android-sdk-licenses: false
          # The action's default includes the retired "tools" package.
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar assinatura de desenvolvimento
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US'
      - name: Compilar, testar gestos e verificar Android Lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace --no-daemon
      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/outputs/roborazzi/
          retention-days: 14
      - name: Guardar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
