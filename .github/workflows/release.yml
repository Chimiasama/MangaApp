name: Publicar Release APK Automático

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag da Versão (ex: v1.1.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish-release:
    name: Compilar APK e Publicar Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Configurar JDK 21 (Compatível com AGP e Gradle moderno)
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 2. Configurar cache do Gradle
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # 3. Aceitar licenças do Android SDK
      - name: Aceitar licenças do Android SDK
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      # 4. Preparar ambiente e chaves de assinatura
      - name: Preparar ambiente e keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.MANGA_SIGNING_KEYSTORE_BASE64 }}
        run: |
          touch .env
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Configure MANGA_SIGNING_KEYSTORE_BASE64 com a chave fixa de assinatura. Uma chave nova impediria atualizar instalações existentes. Veja docs/github-updates.md."
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey > /dev/null
          chmod +x ./gradlew

      # 5. Determinar tag de versão
      - name: Determinar tag de versão
        id: versioning
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # Extrai versionName do build.gradle.kts
            RAW_VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${RAW_VERSION}"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      # 6. Compilar o APK
      - name: Compilar APK
        run: |
          ./gradlew assembleDebug --stacktrace

      # 7. Localizar e renomear o arquivo APK gerado
      - name: Preparar APK para Release
        id: prepare_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Erro: Nenhum APK encontrado!"
            exit 1
          fi
          TAG="${{ steps.versioning.outputs.TAG_NAME }}"
          DEST="MangaReader-${TAG}.apk"
          cp "$APK_PATH" "$DEST"
          echo "APK_FILE=$DEST" >> $GITHUB_OUTPUT
          echo "APK preparado: $DEST"

      # 8. Criar ou Atualizar Release no GitHub com o APK anexado
      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Manga Reader ${{ steps.versioning.outputs.TAG_NAME }}
          body: |
            ## O que há de novo no Manga Reader ${{ steps.versioning.outputs.TAG_NAME }}
            
            - Atualização automática compilada diretamente pelo GitHub Actions.
            - Correções de estabilidade e melhorias de leitura e download de mangás.
            
            ### Como instalar:
            1. Baixe o arquivo `.apk` abaixo no seu celular Android.
            2. Toque no arquivo baixado e confirme a instalação/atualização.
            3. Você também pode atualizar diretamente pelas Configurações do app.
          files: ${{ steps.prepare_apk.outputs.APK_FILE }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
