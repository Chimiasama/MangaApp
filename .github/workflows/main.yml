name: Gerar APK de Teste (Celular)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # 1. Configurar JDK 21 (Requisito mínimo do AGP 9.1.1 e Gradle 9.3.1)
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 2. Configurar cache do Gradle para builds rápidos
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # 3. Aceitar licenças do Android SDK (usando caminhos oficiais do runner)
      - name: Aceitar licenças do Android SDK
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      # 4. Preparar arquivos de ambiente e chaves de assinatura
      - name: Preparar chaves e ambiente
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.MANGA_SIGNING_KEYSTORE_BASE64 }}
        run: |
          # 1. Cria .env se ausente para o secrets-gradle-plugin
          touch .env

          # A mesma chave deve assinar APKs de teste e de atualização.
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Configure MANGA_SIGNING_KEYSTORE_BASE64. Veja docs/github-updates.md. Não é seguro gerar outra assinatura a cada build."
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey > /dev/null

          # 3. Se for release, garante chave de upload
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
              echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
              echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            elif [ ! -f "my-upload-key.jks" ]; then
              echo "Gerando chave release padrão..."
              keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android,O=Android,C=US"
              echo "STORE_PASSWORD=android" >> $GITHUB_ENV
              echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            fi
          fi

          # 4. Conceder permissão de execução ao ./gradlew
          chmod +x ./gradlew

      # 5. Compilar o APK usando ./gradlew
      - name: Compilar APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      # 6. Salvar o APK gerado como artefato para download
      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-APK-Teste
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
