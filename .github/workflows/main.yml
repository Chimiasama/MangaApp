name: Gerar APK de Teste (Celular)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # 1. Configurar JDK 21 (Requisito mínimo do AGP 9.1.1 e Gradle 9.3.1)
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 2. Configurar cache do Gradle para builds rápidos
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # 3. Aceitar licenças do Android SDK (usando caminhos oficiais do runner)
      - name: Aceitar licenças do Android SDK
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      # 4. Preparar arquivos de ambiente e chaves de assinatura
      - name: Preparar chaves e ambiente
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.MANGA_SIGNING_KEYSTORE_BASE64 }}
        run: |
          # 1. Cria .env se ausente para o secrets-gradle-plugin
          touch .env

          bash .github/scripts/prepare-debug-signing.sh

          # 3. Se for release, garante chave de upload
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
              echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
              echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            else
              # Sem chave privada de release, use a mesma identidade dos APKs de teste.
              echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/debug.keystore" >> "$GITHUB_ENV"
              echo "KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
              echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
              echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            fi
          fi

          # 4. Conceder permissão de execução ao ./gradlew
          chmod +x ./gradlew

      # 5. Compilar o APK usando ./gradlew
      - name: Compilar APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      # 6. Salvar o APK gerado como artefato para download
      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-APK-Teste
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
