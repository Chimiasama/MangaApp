name: Manual APK Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permissão ao gradlew
        run: chmod +x ./gradlew

      - name: Build do APK
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Localizar o APK gerado
        id: apk
        shell: bash
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            APK_PATH=$(find . -path '*build/outputs/apk/release/*.apk' | head -n 1)
          else
            APK_PATH=$(find . -path '*build/outputs/apk/debug/*.apk' | head -n 1)
          fi

          echo "apk_path=${APK_PATH}" >> "$GITHUB_OUTPUT"
          echo "APK encontrado: ${APK_PATH}"

      - name: Upload do APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: mangaapp-${{ github.event.inputs.build_type }}-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
