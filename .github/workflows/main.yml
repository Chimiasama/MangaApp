name: Manual APK Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar chaves de assinatura
        run: |
          # 1. Se debug.keystore não estiver presente, restaura do debug.keystore.base64
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "debug.keystore restaurado com sucesso."
          fi

          # 2. Se a build for release, configura ou gera chave compatível
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
              echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
              echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            elif [ ! -f "my-upload-key.jks" ]; then
              echo "Gerando chave de assinatura padrão para release..."
              keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android,O=Android,C=US"
              echo "STORE_PASSWORD=android" >> $GITHUB_ENV
              echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            fi
          fi

      - name: Dar permissão ao gradlew
        run: chmod +x ./gradlew

      - name: Build do APK
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            ./gradlew :app:assembleDebug --stacktrace
          fi

      - name: Localizar o APK gerado
        id: apk
        shell: bash
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          echo "apk_path=${APK_PATH}" >> "$GITHUB_OUTPUT"
          echo "APK encontrado: ${APK_PATH}"

      - name: Upload do APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: mangaapp-${{ github.event.inputs.build_type }}-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
