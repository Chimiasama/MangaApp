name: Gerar APK de Teste (Celular)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # 1. Configurar JDK 17 (Requisito mínimo do AGP 9.1.1 e Gradle 9.3.1)
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 2. Configurar Gradle 9.3.1 oficialmente (evita problemas de wrapper ausente ou desatualizado)
      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # 3. Configurar Android SDK e aceitar licenças
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças do Android SDK
        run: |
          yes | sdkmanager --licenses || true

      # 4. Preparar arquivos de ambiente e chaves de assinatura
      - name: Preparar ambiente e chaves
        run: |
          # Garante que .env exista para o secrets-plugin
          touch .env

          # Garante que debug.keystore exista para a assinatura de debug
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "debug.keystore restaurado a partir do base64."
            else
              echo "Gerando novo debug.keystore padrão..."
              keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # Se for build release, garante que a chave de upload exista
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
              echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
              echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            elif [ ! -f "my-upload-key.jks" ]; then
              echo "Gerando chave padrão para build release..."
              keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android,O=Android,C=US"
              echo "STORE_PASSWORD=android" >> $GITHUB_ENV
              echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            fi
          fi

          # Garante permissão no gradlew se ele existir
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper --gradle-version 9.3.1
            chmod +x ./gradlew
          fi

      # 5. Compilar o APK
      - name: Compilar APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle :app:assembleRelease --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      # 6. Salvar o APK gerado como artefato para download
      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-APK-Teste
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
